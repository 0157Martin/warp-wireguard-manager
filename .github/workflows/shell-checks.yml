name: shell-checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n install.sh warp-wireguard.sh
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh warp-wireguard.sh
